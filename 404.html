<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a09" />
  <meta name="robots" content="noindex" />
  <title>Not found · Anh Trinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #0e0d0b;
      color: #f2ede4;
      font-family: 'DM Mono', 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(201,64,64,0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .wrap {
      position: relative;
      padding: 48px 32px;
      max-width: 520px;
      text-align: center;
      z-index: 1;
    }
    .eyebrow {
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(242,237,228,0.55);
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
    }
    .big {
      font-family: 'Cormorant', Georgia, serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(3rem, 8vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
    }
    p {
      font-size: 0.82rem;
      line-height: 1.6;
      color: rgba(242,237,228,0.70);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f2ede4;
      text-decoration: none;
      padding: 12px 24px;
      border: 1px solid rgba(242,237,228,0.3);
      border-radius: 999px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 1s forwards;
      transition: border-color 0.25s ease, color 0.25s ease, gap 0.25s ease;
    }
    a:hover { border-color: #c94040; color: #c94040; gap: 18px; }
    .film-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.06;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.9  0 0 0 0 0.9  0 0 0 0 0.9  0 0 0 0.8 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
      mix-blend-mode: screen;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="film-grain"></div>
  <div class="wrap">
    <p class="eyebrow">Error · 404</p>
    <h1 class="big">This frame is missing.</h1>
    <p>The page you were looking for doesn't exist, or it quietly moved on. Return to the archive to keep exploring.</p>
    <a href="/">Back to the portfolio →</a>
  </div>
</body>
</html>
