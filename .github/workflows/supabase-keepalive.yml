name: Supabase keep-alive

# Supabase free projects pause after inactivity. We exercise the same public
# REST contract as the site daily, so the check catches both pauses and grant drift.
#
# Why DAILY (not every few days)? GitHub's scheduled runs are "best effort" — they can be
# delayed or skipped entirely under load. A daily ping keeps a comfortable margin even if a
# few runs are missed.
#
# TWO THINGS THIS CANNOT DO — read these:
#   1. A read-only ping CANNOT un-pause an already-paused project. If this job starts failing,
#      the project is already paused: restore it once in the Supabase dashboard and it will
#      pass again.
#   2. GitHub auto-DISABLES scheduled workflows after 60 days with no commits to the repo.
#      If you don't touch this repo for two months, this keep-alive silently stops.
#
# For a bulletproof backstop that never auto-disables, ALSO add a free external pinger
# (e.g. https://cron-job.org) hitting this exact URL every 3 days with the two headers below:
#   GET https://beanpxolozlggbwdoqjl.supabase.co/rest/v1/photos?limit=1&select=id
#   apikey: <anon key>      Authorization: Bearer <anon key>

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC, every day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Supabase visitor reads
        env:
          SUPABASE_URL: https://beanpxolozlggbwdoqjl.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlYW5weG9sb3psZ2did2RvcWpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3Mjk5ODgsImV4cCI6MjA5MDMwNTk4OH0.isvxqR-lIk8nchcGdBBXq9OQ2COIyr4AnDO6hOxzLHc
        run: |
          set -euo pipefail
          PHOTOS_SELECT="id,cloudinary_id,title,description,series,date_taken,location,camera,lens,aperture,shutter_speed,iso,focal_length,uploaded_at,order_timestamp,starred"
          ALBUMS_SELECT="name,description,cover_cloudinary_id,sort_order,created_at"
          echo "Checking visitor data at $(date -u)"
          STATUS=$(curl -sS \
            --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
            -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/photos?select=$PHOTOS_SELECT&order=order_timestamp.desc&limit=1") || true
          if [ "$STATUS" != "200" ] || ! jq -e 'type == "array" and length >= 1' /tmp/resp.json >/dev/null 2>&1; then
            echo "Photos read failed: HTTP $STATUS"
            cat /tmp/resp.json 2>/dev/null || true
            exit 1
          fi

          STATUS=$(curl -sS \
            --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
            -o /tmp/albums.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/albums?select=$ALBUMS_SELECT&order=sort_order.asc,name.asc&limit=1") || true
          if [ "$STATUS" != "200" ] || ! jq -e 'type == "array"' /tmp/albums.json >/dev/null 2>&1; then
            echo "Albums read failed: HTTP $STATUS"
            cat /tmp/albums.json 2>/dev/null || true
            exit 1
          fi

          echo "Supabase visitor reads are healthy."
