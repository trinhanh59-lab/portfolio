name: Weekly portfolio health

on:
  schedule:
    # Every Monday at 14:00 UTC
    - cron: "0 14 * * MON"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository behavior
        run: |
          node scripts/validate.mjs
          node scripts/smoke-functions.mjs

      - name: Check production health
        run: node scripts/check-live-site.mjs
